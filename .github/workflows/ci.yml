name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nuvem
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: nuvem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuvem -d nuvem"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://nuvem:changeme@127.0.0.1:5432/nuvem
      BETTER_AUTH_URL: http://127.0.0.1:18000
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef
      PORT: 18000

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Migrate database
        run: pnpm db:migrate

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
