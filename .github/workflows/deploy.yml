name: Publish and deploy
on:
  workflow_call:
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: oracle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: ghcr.io/caiohperlin/silverbox-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test production startup and rollback on ARM64
        env:
          DEPLOY_api: api
          DEPLOY_IMAGE: ghcr.io/caiohperlin/silverbox-api:${{ github.sha }}
          DEPLOY_USER: ${{ github.actor }}
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --test deploy/test/*.test.ts
      - name: Deploy immutable release
        if: vars.ORACLE_READY == 'true'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          opts=(-i "$key" -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15)
          target="$SSH_USER@$SSH_HOST"
          release="/home/perlin/silverbox/api/releases/$GITHUB_SHA"
          ssh "${opts[@]}" "$target" "mkdir -p '$release' && chmod 700 '$release'"
          scp "${opts[@]}" deploy/compose.yml deploy/release.sh "$target:$release/"
          printf '%s' "$GH_TOKEN" | ssh "${opts[@]}" "$target" "bash '$release/release.sh' 'ghcr.io/caiohperlin/silverbox-api:$GITHUB_SHA' '$GITHUB_ACTOR'"
