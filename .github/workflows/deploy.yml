name: Publish and deploy
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      deploy:
        description: Apply the validated main revision to Oracle
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: deploy-api
  cancel-in-progress: false
jobs:
  authorize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.revision.outputs.ready }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/github-script@v7
        id: revision
        with:
          script: |
            await require('./.github/scripts/release.cjs').authorize({ github, context, core });

  deploy:
    needs: authorize
    if: needs.authorize.outputs.ready == 'true'
    env:
      RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
    runs-on: ubuntu-24.04-arm
    environment: oracle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check revision before publication
        uses: actions/github-script@v7
        id: publish-check
        with:
          script: |
            await require('./.github/scripts/release.cjs').current({ github, context, core }, process.env.RELEASE_SHA);
      - uses: docker/build-push-action@v6
        if: steps.publish-check.outputs.current == 'true'
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: ghcr.io/caiohperlin/silverbox-api:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=api-release-arm64
          cache-to: type=gha,scope=api-release-arm64,mode=max
      - name: Test production startup and rollback on ARM64
        if: steps.publish-check.outputs.current == 'true'
        env:
          DEPLOY_COMPONENT: api
          DEPLOY_IMAGE: ghcr.io/caiohperlin/silverbox-api:${{ env.RELEASE_SHA }}
          DEPLOY_USER: ${{ github.actor }}
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --test deploy/test/*.test.ts
      - name: Test private production release on Oracle
        if: steps.publish-check.outputs.current == 'true'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          opts=(-i "$key" -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15)
          target="$SSH_USER@$SSH_HOST"
          check="/home/perlin/silverbox/checks/api/$RELEASE_SHA"
          ssh "${opts[@]}" "$target" "umask 077; mkdir -p '$check/deploy/test'"
          scp "${opts[@]}" deploy/compose.yml deploy/release.sh "$target:$check/deploy/"
          scp "${opts[@]}" deploy/test/release.test.ts deploy/oracle-check.sh "$target:$check/deploy/test/"
          printf '%s\n' "$GH_TOKEN" | ssh "${opts[@]}" "$target" "bash '$check/deploy/test/oracle-check.sh' '$check' 'api' 'ghcr.io/caiohperlin/silverbox-api:$RELEASE_SHA' '$GITHUB_ACTOR'"
      - name: Check revision before applying release
        if: >-
          steps.publish-check.outputs.current == 'true' && vars.ORACLE_READY == 'true' &&
          (github.event_name == 'workflow_run' || inputs.deploy)
        uses: actions/github-script@v7
        id: apply-check
        with:
          script: |
            await require('./.github/scripts/release.cjs').current({ github, context, core }, process.env.RELEASE_SHA);
      - name: Deploy immutable release
        id: apply
        if: steps.apply-check.outputs.current == 'true'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          opts=(-i "$key" -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15)
          target="$SSH_USER@$SSH_HOST"
          release="/home/perlin/silverbox/api/releases/$RELEASE_SHA"
          ssh "${opts[@]}" "$target" "mkdir -p '$release' && chmod 700 '$release'"
          scp "${opts[@]}" deploy/compose.yml deploy/release.sh "$target:$release/"
          printf '%s' "$GH_TOKEN" | ssh "${opts[@]}" "$target" "bash '$release/release.sh' 'ghcr.io/caiohperlin/silverbox-api:$RELEASE_SHA' '$GITHUB_ACTOR'"
      - name: Verify public HTTPS with normal DNS
        if: steps.apply.outcome == 'success'
        env:
          DEPLOY_COMPONENT: api
        run: node --test deploy/public.test.ts
