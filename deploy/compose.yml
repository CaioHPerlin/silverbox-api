name: silverbox-api
services:
  api:
    image: ${IMAGE:?Set the immutable API image}
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://silverbox:${POSTGRES_PASSWORD:?Required}@db:5432/silverbox
      BETTER_AUTH_URL: https://${API_HOST:?Required}
      FRONTEND_ORIGINS: https://${WEB_HOST:?Required}
      STORAGE_ROOT: /var/lib/silverbox/files
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-10737418240}
    volumes:
      - files:/var/lib/silverbox/files
    networks: [private, traefik]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik
      traefik.http.routers.silverbox-api.rule: Host(`${API_HOST}`)
      traefik.http.routers.silverbox-api.entrypoints: websecure
      traefik.http.routers.silverbox-api.tls.certresolver: letsencrypt
      traefik.http.services.silverbox-api.loadbalancer.server.port: '8000'
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: silverbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: silverbox
    volumes: [database:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U silverbox -d silverbox']
      interval: 3s
      timeout: 3s
      retries: 20
networks:
  private:
    internal: true
  traefik:
    external: true
volumes:
  database:
  files:
